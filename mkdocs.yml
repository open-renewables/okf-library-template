# Site configuration (SDD C-07, I-13): one file read by MkDocs (blocking) and Zensical (non-blocking).
# The site is built from knowledge/ in place; nothing here changes a concept file.
site_name: OKF library template
repo_url: https://github.com/open-renewables/okf-library-template
edit_uri: edit/main/knowledge/
docs_dir: knowledge
strict: true
use_directory_urls: true
validation:
  links:
    absolute_links: warn
    anchors: warn
theme:
  name: material
  features:
    - navigation.indexes
    - content.action.edit
plugins:
  - search
  - tags
markdown_extensions:
  - footnotes
  - attr_list
  - toc:
      permalink: true
extra:
  social:
    - icon: material/message-alert-outline
      link: https://github.com/open-renewables/okf-library-template/issues/new/choose
      name: Raise an issue
  status:
    draft: Draft
    stable: Stable
    deprecated: Deprecated
