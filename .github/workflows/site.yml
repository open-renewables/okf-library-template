# Site build (SDD C-07, W-08; ADR-001). One mkdocs.yml, two builders: MkDocs with Material blocks; Zensical does not.
# A preview artifact is built for every change; a tag run also writes release.json, which names the release the site
# shows (FR8.3). Pages is published only for a stable tag of v1.0.0 or later in a library that sets library.site_url
# (FR8.5), so the template and every library stay off Pages before then.
name: site

on:
  pull_request:
    paths:
      - "knowledge/**"
      - "profile/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/okfprofile/site*.py"
      - ".github/workflows/site.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mkdocs:
    name: mkdocs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.deploy.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --group site-mkdocs
      - name: Build the site (strict; blocking)
        run: uv run poe docs-build
      - name: Write the release manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run poe docs-manifest "${{ github.ref_name }}" "${{ github.sha }}"
      - name: Does this tag publish the site?
        id: deploy
        run: echo "deploy=$(uv run poe site-deploy-check "${{ github.ref_name }}" | tail -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          if-no-files-found: error
      - name: Package the site for Pages
        if: steps.deploy.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  zensical:
    name: zensical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    env:
      LYCHEE_VERSION: lychee-v0.24.2
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --group site-mkdocs --group site-zensical
      - name: The MkDocs build, to compare pages with
        run: uv run poe docs-build
      - name: Build with Zensical and compare its pages (non-blocking)
        run: uv run poe docs-zensical
      - name: Install lychee at the pinned version and check its checksum
        run: |
          curl -sSfL -o "$RUNNER_TEMP/lychee.tar.gz" "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/lychee-bin"
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/lychee-bin"
          echo "$RUNNER_TEMP/lychee-bin" >> "$GITHUB_PATH"
      - name: Check the links and fragments of the Zensical output
        run: uv run poe docs-linkcheck --site site-zensical

  deploy:
    name: deploy
    needs: mkdocs
    if: needs.mkdocs.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
