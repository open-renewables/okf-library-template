# Release (SDD W-07, C-10, FR7.3, FR7.4). A pushed tag vX.Y.Z cuts a release:
#   gate     every change merged since the previous tag has its revision line, and the tagged tree validates
#   build    the archive, its checksum and its manifest, checked against each other
#   rebuild  a second clean checkout of the tag rebuilds the archive and the tar digests must match (ADR-004)
#   publish  the only job with write access: a draft Release is filled, then published, so an immutable Release is
#            complete the moment it becomes final; marked pre-release while the major version is 0 or the tag has
#            a pre-release suffix
# Only `publish` can write; every other job reads.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Revision-line gate and validation at the tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run poe release-gate "${{ github.ref_name }}"

  build:
    name: build
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Build the archive, checksum and manifest
        run: uv run poe bundle "${{ github.ref_name }}"
      - name: Check the archive against its manifest and checksum
        run: uv run poe bundle-verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist
          if-no-files-found: error

  rebuild:
    name: rebuild
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Rebuild from the tag and compare the tar digests
        run: uv run poe bundle-rebuild

  publish:
    name: publish
    needs: [build, rebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Create the Release as a draft, attach the files, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v0.*|*-*) flags="--prerelease" ;;
            *) flags="" ;;
          esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "$TAG" $flags
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
